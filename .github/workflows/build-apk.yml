name: Build JARVIS Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build JARVIS Android
    runs-on: ubuntu-latest

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            automake \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zip \
            unzip

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      - name: Build JARVIS
        run: |
          buildozer android debug

      - name: Show generated files
        run: |
          echo "Arquivos Android gerados:"
          find . -type f \( -name "*.aab" -o -name "*.apk" \) -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AAB
          path: bin/*.aab
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: ignore
          retention-days: 7
