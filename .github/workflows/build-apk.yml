name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build JARVIS Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Buildozer cache
        run: mkdir -p "$HOME/.buildozer"

      - name: Build APK with official Buildozer Docker
        run: |
          docker pull ghcr.io/kivy/buildozer:latest
          docker run --rm \
            --volume "$GITHUB_WORKSPACE":/home/user/hostcwd \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
